name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle from the Wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Test Ren'Py Android path patcher
        run: python3 -m unittest discover -s tools/renpy-8.5.3 -p 'test_*.py'

      - name: Set up JDK 21 for Ren'Py Android packaging
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK for Ren'Py
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36

      - name: Build and import Ren'Py 8.5.3 runtime
        run: bash tools/renpy-8.5.3/build_runtime.sh

      - name: Restore JDK 17 for Ramen
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Assemble, test, and lint
        run: ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest lintDebug

      - name: Print Android lint report
        if: failure()
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            echo "===== FULL ANDROID LINT REPORT ====="
            cat "$report"
          else
            echo "Android lint text report was not generated at: $report"
            find app/build -type f -name 'lint-results-*.txt' -print 2>/dev/null || true
          fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ramen-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
