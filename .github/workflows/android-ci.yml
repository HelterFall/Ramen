name: Android checks (APK disabled)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and lint only — no APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle from the Wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          # Same-repository PRs may persist their Gradle cache; untrusted forks stay read-only.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Test Ren'Py Android path patcher
        run: python3 -m unittest discover -s tools/renpy-8.5.3 -p 'test_*.py'

      - name: Set up Android SDK for unit tests and lint
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36

      - name: Compile checks, unit tests, and lint (APK packaging disabled)
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug

      - name: Print Android lint report
        if: failure()
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            echo "===== FULL ANDROID LINT REPORT ====="
            cat "$report"
          else
            echo "Android lint text report was not generated at: $report"
            find app/build -type f -name 'lint-results-*.txt' -print 2>/dev/null || true
          fi
